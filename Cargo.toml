[workspace]
resolver = "2"
members = ["crates/podimo-rs"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "EUPL-1.2"
repository = "https://github.com/midasvo/podimo-ce"

[workspace.lints.rust]
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Deny on CI via `clippy -- -D warnings`; only opinionated stuff goes here.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

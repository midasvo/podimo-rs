[package]
name = "podimo-rs"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust port of podimo-ce: Podimo-to-RSS proxy"

[[bin]]
name = "podimo-rs"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros", "tokio", "http1", "query", "form"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
http-body-util = "0.1"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures = "0.3"

# Outbound HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Templates
minijinja = { version = "2", features = ["loader"] }

# RSS
rss = { version = "2", features = ["validation"] }
quick-xml = "0.42"

# Caching
moka = { version = "0.12", features = ["future"] }

# Config
dotenvy = "0.15"

# Errors + logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
sha2 = "0.11"
hex = "0.4"
regex = "1"
rand = "0.8"
urlencoding = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mime_guess = "2"
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
